service: opnform-api

params:
  default:
    ssmPrefix: /opnform/prod

provider:
  name: aws
  stage: prod
  stackName: opnform-prod
  deploymentMethod: changesets
  region: us-east-1
  deploymentBucket:
    name: ${env:AWS_API_DEPLOYMENT_BUCKET}
  httpApi:
    name: opnform-prod-api

  iam:
    deploymentRole: ${env:AWS_CFN_ROLE_ARN}
    role:
      name: opnform-prod-lambda-role
      statements:
        - Effect: Allow
          Action: ssm:GetParameters
          Resource: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/opnform/prod/*

  environment:
    # Non-sensitive deploy-time SSM parameters
    APP_DEBUG: 'false'
    APP_ENV: production
    APP_NAME: 'OpnForm'
    TRUSTED_PROXIES: '*'
    CACHE_DRIVER: 'database'
    DB_CONNECTION: 'pgsql'
    FILESYSTEM_DRIVER: 's3'
    AWS_USE_PATH_STYLE_ENDPOINT: 'true'
    JWT_SKIP_IP_UA_VALIDATION: 'true'
    LOCAL_FILESYSTEM_VISIBILITY: 'public'
    LOG_CHANNEL: 'errorlog'
    LOG_LEVEL: 'debug'
    PHP_MAX_EXECUTION_TIME: '600'
    PHP_MEMORY_LIMIT: '1G'
    PHP_POST_MAX_SIZE: '64M'
    PHP_UPLOAD_MAX_FILESIZE: '64M'
    QUEUE_CONNECTION: 'sqs'
    SQS_QUEUE: ${construct:jobs.queueUrl}
    SELF_HOSTED: 'true'
    SESSION_DRIVER: 'database'
    SESSION_LIFETIME: '120'
    SESSION_SECURE_COOKIE: 'true'
    SESSION_HTTP_ONLY: 'true'
    SESSION_SAME_SITE: 'none'
    SHOW_OFFICIAL_TEMPLATES: 'true'
    CUSTOM_CODE_ENABLE_SELF_HOSTED: 'true'

    APP_URL: ${ssm:${param:ssmPrefix}/APP_URL}
    FRONT_URL: ${ssm:${param:ssmPrefix}/FRONT_URL}
    AWS_BUCKET: ${ssm:${param:ssmPrefix}/AWS_BUCKET}
    AWS_ENDPOINT: ${ssm:${param:ssmPrefix}/AWS_ENDPOINT}
    AWS_URL: ${ssm:${param:ssmPrefix}/AWS_URL}
    MAIL_FROM_ADDRESS: ${ssm:${param:ssmPrefix}/MAIL_FROM_ADDRESS}
    MAIL_FROM_NAME: ${ssm:${param:ssmPrefix}/MAIL_FROM_NAME}

    # Sensitive runtime secrets are read by Bref at cold start.
    APP_KEY: bref-ssm:${param:ssmPrefix}/APP_KEY
    DATABASE_URL: bref-ssm:${param:ssmPrefix}/DATABASE_URL
    JWT_SECRET: bref-ssm:${param:ssmPrefix}/JWT_SECRET

package:
  patterns:
    - '!node_modules/**'
    - '!public/storage'
    - '!resources/assets/**'
    - '!resources/css/**'
    - '!resources/images/**'
    - '!resources/js/**'
    - '!storage/**'
    - '!tests/**'
    - '!database/*.sqlite'
    - '!public/build/**'
    - 'public/build/manifest.json'

functions:
  web:
    name: opnform-prod-web
    handler: public/index.php
    runtime: php-83-fpm
    timeout: 28
    events:
      - httpApi: '*'

  artisan:
    name: opnform-prod-artisan
    handler: artisan
    runtime: php-83-console
    timeout: 720
    events:
      - schedule:
          name: opnform-prod-artisan-schedule
          rate: rate(1 minute)
          input: '"schedule:run"'

constructs:
  jobs:
    type: queue
    batchSize: 1
    maxConcurrency: 4
    worker:
      name: opnform-prod-jobs-worker
      handler: Bref\LaravelBridge\Queue\QueueHandler
      runtime: php-83
      timeout: 60

custom:
  scriptable:
    hooks:
      before:package:createDeploymentArtifacts:
        - composer dump-autoload -o
        - php artisan config:clear
        - php artisan route:cache
        - php artisan view:cache
        - php artisan event:cache

plugins:
  - ./vendor/bref/bref
  - serverless-lift
  - serverless-scriptable-plugin
