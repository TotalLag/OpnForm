AWSTemplateFormatVersion: '2010-09-09'
Description: One-time direct AWS deployment boundary for OpnForm production

Parameters:
  ServerlessArtifactBucketName:
    Type: String
    Description: Name for the protected Serverless deployment artifact bucket.
  UiShadowArtifactBucketName:
    Type: String
    Description: Name for the protected UI shadow artifact bucket.

Resources:
  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  ServerlessArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ServerlessArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  UiShadowArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref UiShadowArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireShadowArtifacts
            Status: Enabled
            ExpirationInDays: 14
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  OpnFormCloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpnFormCloudFormationExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OpnFormProductionStack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ServerlessArtifactBucket.Arn
              - Sid: ReadDeploymentObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${ServerlessArtifactBucket.Arn}/*'
              - Sid: ManageProductionFunctions
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:opnform-prod-*'
              - Sid: ReadBrefLayerVersionMetadata
                Effect: Allow
                Action: lambda:GetLayerVersion
                Resource:
                  - arn:aws:lambda:us-east-1:534081306603:layer:php-83-fpm:70
                  - arn:aws:lambda:us-east-1:534081306603:layer:php-83:70
                  - arn:aws:lambda:us-east-1:534081306603:layer:console:122
              - Sid: CreateProductionEventSourceMappings
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:TagResource
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*'
              - Sid: ManageProductionEventSourceMappings
                Effect: Allow
                Action:
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*'
              - Sid: ListProductionEventSourceMappings
                Effect: Allow
                Action: lambda:ListEventSourceMappings
                Resource: '*'
              - Sid: CreateProductionQueues
                Effect: Allow
                Action: sqs:CreateQueue
                Resource: '*'
              - Sid: ManageProductionQueues
                Effect: Allow
                Action:
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ListQueueTags
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:opnform-prod-*'
              - Sid: ManageProductionSchedule
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DescribeRule
                  - events:ListTargetsByRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                  - events:TagResource
                  - events:UntagResource
                Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/opnform-prod-*'
              - Sid: CreateProductionLogGroups
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: '*'
              - Sid: ManageProductionLogGroups
                Effect: Allow
                Action:
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/opnform-prod-*'
              - Sid: DescribeProductionLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: CreateProductionLambdaRole
                Effect: Allow
                Action: iam:CreateRole
                Resource: '*'
              - Sid: ManageProductionLambdaRole
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/opnform-prod-lambda-role'
              - Sid: ManageHttpApi
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:TagResource
                Resource: '*'
              - Sid: ReadUiShadowArtifacts
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt UiShadowArtifactBucket.Arn
              - Sid: ReadUiShadowArtifactObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${UiShadowArtifactBucket.Arn}/opnform-ui-shadow-*/*'
              - Sid: ManageUiShadowPublicBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                Resource: arn:aws:s3:::opnform-ui-shadow-*-assets
              - Sid: ManageUiShadowFunctions
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:CreateFunctionUrlConfig
                  - lambda:DeleteFunction
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:GetPolicy
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:UpdateFunctionUrlConfig
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:opnform-ui-shadow-*'
              - Sid: ManageUiShadowLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/opnform-ui-shadow-*'
              - Sid: ManageUiShadowLambdaRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/opnform-ui-shadow-*-lambda-role'
              - Sid: PassOnlyUiShadowLambdaRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/opnform-ui-shadow-*-lambda-role'
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ManageUiShadowCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateCachePolicy
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateDistributionWithTags
                  - cloudfront:CreateFunction
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:CreateOriginRequestPolicy
                  - cloudfront:DeleteCachePolicy
                  - cloudfront:DeleteDistribution
                  - cloudfront:DeleteFunction
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:DeleteOriginRequestPolicy
                  - cloudfront:DescribeFunction
                  - cloudfront:GetCachePolicy
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetFunction
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginRequestPolicy
                  - cloudfront:ListTagsForResource
                  - cloudfront:PublishFunction
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:UpdateCachePolicy
                  - cloudfront:UpdateDistribution
                  - cloudfront:UpdateFunction
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:UpdateOriginRequestPolicy
                Resource: '*'
              - Sid: ManageUiShadowAlarms
                Effect: Allow
                Action:
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:PutMetricAlarm
                Resource: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:opnform-ui-shadow-*'

  OpnFormGitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: OpnFormGitHubDeployRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubActionsOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:TotalLag/OpnForm:environment:opnform-prod
      Policies:
        - PolicyName: DeployOpnFormProductionStack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeployProductionChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/opnform-prod/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/opnform-prod-change-set/*'
              - Sid: ReadProductionStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/opnform-prod/*'
              - Sid: ValidateServerlessTemplate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: PassOnlyTheProductionExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/OpnFormCloudFormationExecutionRole'
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: UploadOnlyDeploymentArtifacts
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub '${ServerlessArtifactBucket.Arn}/*'
              - Sid: ListTheArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt ServerlessArtifactBucket.Arn
              - Sid: ResolveOnlyProductionParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/opnform/prod/*'
              - Sid: ReadProductionFunctionMetadata
                Effect: Allow
                Action: lambda:GetFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:opnform-prod-*'
              - Sid: UploadUiShadowLambdaArtifacts
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub '${UiShadowArtifactBucket.Arn}/opnform-ui-shadow-*/*'
              - Sid: ListUiShadowArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt UiShadowArtifactBucket.Arn
              - Sid: UploadUiShadowPublicAssets
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: arn:aws:s3:::opnform-ui-shadow-*-assets/*
              - Sid: ListUiShadowPublicBuckets
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: arn:aws:s3:::opnform-ui-shadow-*-assets
              - Sid: DeployUiShadowChangeSets
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/opnform-ui-shadow-*/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/opnform-ui-shadow-*/*'
              - Sid: ReadUiShadowStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStackResources
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/opnform-ui-shadow-*/*'
              - Sid: ReadUiShadowDistribution
                Effect: Allow
                Action: cloudfront:GetDistribution
                Resource: '*'
              - Sid: VerifyCallerIdentity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'

Outputs:
  ArtifactBucketName:
    Description: Serverless deployment artifact bucket
    Value: !Ref ServerlessArtifactBucket
  CloudFormationExecutionRoleArn:
    Description: Role CloudFormation assumes for the opnform-prod stack
    Value: !GetAtt OpnFormCloudFormationExecutionRole.Arn
  GitHubDeployRoleArn:
    Description: Set this as the OPNFORM_AWS_DEPLOY_ROLE_ARN GitHub environment variable
    Value: !GetAtt OpnFormGitHubDeployRole.Arn
  GitHubEnvironment:
    Description: GitHub environment required by the OIDC trust policy
    Value: opnform-prod
